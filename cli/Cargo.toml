[package]
name = "qwq"
version = "0.1.0"
edition = "2024"
description = "Minimal CLI for agent-state-indicator"
authors = ["nanayonkyuu"]
repository = "https://github.com/7749Y/agent-state-indicator"
homepage = "https://github.com/7749Y/agent-state-indicator"

[dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
